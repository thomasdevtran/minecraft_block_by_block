name: Release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:catalog
      - run: npm run build
      - run: npm run check:bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-report
          path: dist/performance-bundle.json
          if-no-files-found: ignore
      - run: npm audit --audit-level=high
